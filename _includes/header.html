<header id="masthead" class="site-header outer">
  <div class="inner">
    <div class="site-header-inside">

      <div class="site-branding">
        {% assign logo_img_is_not_empty = site.header.logo_img | is_not_empty %}
        {% if logo_img_is_not_empty %}
        <p class="site-logo">
          <a href='{{ '/' | relative_url }}'><img src="{{ site.header.logo_img | relative_url }}"
              alt="{{ site.header.title }} Logo" /></a>
        </p>
        {% endif %}
        {% if page.layout == 'home' %}
        <h1 class="site-title"><a href='{{ '/' | relative_url }}'>{{ site.header.title }}</a></h1>
        {% else %}
        <p class="site-title"><a href='{{ '/' | relative_url }}'>{{ site.header.title }}</a></p>
        {% endif %}
      </div><!-- .site-branding -->

      <button id="menu-open" class="menu-toggle"><span class="screen-reader-text">Menu</span><span class="icon-menu"
        aria-hidden="true"></span></button>
      <nav id="main-navigation" class="site-nav" aria-label="Main Navigation">
        <div class="site-nav-inside">
          <button id="menu-close" class="menu-toggle"><span class="screen-reader-text">Menu</span><span class="icon-close"
              aria-hidden="true"></span></button>          
        {% include menu.html %}
        </div>
      </nav><!-- .site-navigation -->

    </div><!-- .site-header-inside -->
  </div><!-- .inner -->
</header><!-- .site-header -->
